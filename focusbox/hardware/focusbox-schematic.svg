<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760">
<rect width="1100" height="760" fill="#fff"/>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:30px;font-weight:bold}.sub{font-size:17px;fill:#475569}.head{font-size:21px;font-weight:bold}.label{font-size:18px}.small{font-size:15px;fill:#475569}.pin{font-size:18px;font-weight:bold;fill:#075985}.wire{stroke:#334155;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.rail{stroke:#dc2626;stroke-width:4}.gnd{stroke:#111827;stroke-width:4}.part{stroke:#172033;stroke-width:3;fill:#f8fafc}.blue{stroke:#0284c7}.green{stroke:#16a34a}.red{stroke:#dc2626}
</style>
<text x="40" y="48" class="title">FocusBox – kopplingsschema</text>
<text x="40" y="78" class="sub">GD32VF103 · logik 3,3 V · aktiv summer matas från 5 V</text>
<rect x="40" y="110" width="1020" height="600" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<!-- MCU -->
<rect x="75" y="255" width="205" height="250" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
<text x="110" y="295" class="head">GD32VF103</text>
<text x="100" y="340" class="pin">PB0</text><text x="100" y="390" class="pin">PB1</text><text x="100" y="440" class="pin">PB10</text><text x="100" y="490" class="pin">PA5</text>
<!-- LED branches -->
<text x="340" y="155" class="head">Indikatorlampor</text>
<text x="330" y="205" class="pin">PB0</text><path d="M390 198 H450" class="wire"/>
<rect x="450" y="181" width="105" height="34" rx="5" class="part"/><path d="M465 198 l18 -12 l18 24 l18 -24 l18 24 l18 -12" class="wire"/>
<text x="455" y="170" class="small">1 kΩ</text>
<path d="M555 198 H615" class="wire"/><circle cx="640" cy="198" r="23" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><path d="M628 198h24 M640 186v24 M656 178l10 -10 M656 218l10 10" class="wire green"/>
<text x="675" y="205" class="label">Grön LED</text><text x="608" y="245" class="small">anod mot PB0</text><path d="M280 340 H320 V198 H390" class="wire"/>
<path d="M640 221 V255" class="wire"/><path d="M610 255 H670 M620 265 H660 M630 275 H650" class="gnd"/>
<text x="330" y="300" class="pin">PB1</text><path d="M390 293 H450" class="wire"/>
<rect x="450" y="276" width="105" height="34" rx="5" class="part"/><path d="M465 293 l18 -12 l18 24 l18 -24 l18 24 l18 -12" class="wire"/>
<text x="455" y="265" class="small">1 kΩ</text><path d="M555 293 H615" class="wire"/><circle cx="640" cy="293" r="23" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><path d="M628 293h24 M640 281v24 M656 273l10 -10 M656 313l10 10" class="wire blue"/>
<text x="675" y="300" class="label">Blå LED</text><text x="608" y="340" class="small">anod mot PB1</text><path d="M280 390 H345 V293 H390" class="wire"/><path d="M640 316 V350" class="wire"/><path d="M610 350 H670 M620 360 H660 M630 370 H650" class="gnd"/>
<text x="340" y="420" class="head">Knapp</text><path d="M280 490 H380" class="wire"/><circle cx="400" cy="490" r="8" fill="#172033"/><path d="M400 490 l55 -28" class="wire"/><circle cx="470" cy="490" r="8" fill="#172033"/><path d="M470 490 H545" class="wire"/><text x="407" y="455" class="small">tryckknapp</text><text x="485" y="480" class="label">GND</text><text x="330" y="525" class="small">PA5 har intern pull-up; knappen sluts till GND</text>
<!-- buzzer transistor -->
<text x="720" y="155" class="head">Summer via NPN-transistor</text>
<text x="715" y="215" class="pin">+5 V</text><path d="M785 208 H870" class="wire"/><circle cx="900" cy="208" r="30" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/><text x="881" y="215" class="label">BZ</text><text x="940" y="215" class="label">aktiv summer</text>
<path d="M900 238 V295 H825" class="wire"/><path d="M825 295 V405" class="wire"/><path d="M805 330 H845 M805 375 H845" class="wire"/><path d="M825 405 V455" class="wire"/>
<text x="865" y="310" class="small">−</text>
<!-- diode parallel -->
<path d="M900 208 V275 H990 V208" class="wire"/><path d="M972 230 l18 -18 l18 18 l-18 18z" class="part"/><text x="958" y="270" class="small">1N4007</text><text x="953" y="190" class="small">band mot +5 V</text>
<!-- transistor symbol -->
<circle cx="825" cy="355" r="42" fill="#fff" stroke="#172033" stroke-width="3"/><path d="M785 355 H825 M825 330 V380 M825 330 L850 310 M825 380 L850 400" class="wire"/><path d="M839 389 l11 11 l-15 -2" fill="#172033"/>
<text x="865" y="365" class="label">NPN</text><text x="858" y="390" class="small">C=summer −</text><text x="858" y="415" class="small">E=GND</text>
<!-- Base connection -->
<path d="M783 355 H735 V520 H700" class="wire"/><rect x="610" y="503" width="90" height="34" rx="5" class="part"/><path d="M620 520 l14 -12 l14 24 l14 -24 l14 24 l14 -12" class="wire"/><text x="635" y="495" class="small">1 kΩ</text><path d="M610 520 H540 V440 H280" class="wire"/><text x="300" y="460" class="small">PB10 → bas</text>
<!-- ground -->
<path d="M825 455 V480" class="wire"/><path d="M795 480 H855 M805 490 H845 M815 500 H835" class="gnd"/><text x="865" y="486" class="label">GND</text>
<text x="75" y="635" class="small">LED-katod till GND. Gemensam GND mellan kort och kopplingsbräda.</text>
<text x="75" y="665" class="small">Transistorns fysiska benordning varierar: anslut efter C/B/E-märkning för just din komponent.</text>
<text x="75" y="690" class="small">Anslut aldrig 5 V till GD32:s GPIO-stift. Kontrollera kortets märkning för 5 V och GND.</text>
</svg>